[mypy]
python_version = 3.12
strict = True
plugins = mypy_django_plugin.main
exclude = migrations/

[mypy-celery.*]
ignore_missing_imports = True

[mypy-authlib.*]
ignore_missing_imports = True

[mypy-ldap3.*]
ignore_missing_imports = True

[mypy.plugins.django-stubs]
django_settings_module = config.settings.dev
